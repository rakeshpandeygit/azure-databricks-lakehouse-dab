resources:
  jobs:
    Sample_Job:
      name: Sample Job
      parameters:
        - name: environment
          default: ${var.environment}
      tasks:
        - task_key: t_order_bronze
          spark_python_task:
            python_file: ../../src/python_script/order_bronze.py
            parameters:
              - "--environment"
              - "{{job.parameters.environment}}"
          environment_key: Default
        - task_key: t_order_silver
          depends_on:
            - task_key: t_order_bronze
          spark_python_task:
            python_file: ../../src/python_script/order_silver.py
            parameters:
              - "--environment"
              - "{{job.parameters.environment}}"
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
